version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: ecommerce_mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/init_replica_set.js:/scripts/init_replica_set.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"localhost:27017\"}]}).ok }'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: ecommerce_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ecommerce_db?replicaSet=rs0&directConnection=true
      - DB_NAME=ecommerce_db
      - TEST_MONGO_URI=mongodb://mongo:27017/ecommerce_test_db?replicaSet=rs0&directConnection=true
      - TEST_DB_NAME=ecommerce_test_db
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local

